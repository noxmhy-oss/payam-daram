 <!-- <button class="my-btn">بمالم</button> -->
 <button class="my-btn"
         onclick="sayhi()"
         onmouseover="this.textContent='تردید نکن'"
         onmouseout="this.textContent='حتما کلیک کن'">حتما کلیک کن</button>
 <script>
         const messages = [
"یه موز بخور انرژی بگیری",
"اشتباه گرفتید",
"سیکتیر دیگه",
"گاهی فقط باید سیکتیر کرد",
"اراده تورو خیار داشت الان موز بود!",

         ];
         function sayhi() {
             const index = Math.floor(Math.random() * messages.length);
             alert(messages[index])
         }
 </script>
